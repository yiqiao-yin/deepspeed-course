# =============================================================================
# 08_vtt/hf_ds_vtt_test2 as a self-contained uv project.
#
#     cd 08_vtt/hf_ds_vtt_test2
#     uv sync                    # creates .venv and installs the LOCKED versions
#     uv run deepspeed --num_gpus=2 llava_video_trainer/video_training_script.py
#
# The committed uv.lock is the point: everyone who clones this repository
# resolves to byte-identical versions. `uv pip install` resolves to whatever is
# newest that day, which is how a tutorial that worked in March stops working in
# September with nobody having touched it. Regenerate deliberately with
# `uv lock --upgrade`.
#
# =============================================================================

[project]
name = "deepspeed-course-08-vtt-hf-ds-vtt-test2"
version = "0.1.0"
description = "Video-text training: LLaVA and seq2seq video trainers"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2",
    "deepspeed>=0.14",
    "transformers>=4.40",
    "trl>=0.9",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# W&B stays optional: every training script wraps `import wandb` in try/except
# and only enables tracking when WANDB_API_KEY is set.
tracking = ["wandb>=0.16"]

[tool.uv]
package = false

# torch is pinned to an explicit CUDA 12.8 build. This is NOT cosmetic:
# PyPI's default torch is now a CUDA 13.0 wheel, and on a host whose driver
# predates CUDA 13 -- 550 and 570 series, which is what much rented hardware
# runs -- it installs fine and then reports cuda.is_available() == False with
# "The NVIDIA driver on your system is too old". Verified on a driver 550.127
# box: uv sync succeeded, torch could not see the GPU at all.
#
# That failure is silent in the worst way: require_gpu() then tells the reader
# they have no GPU while nvidia-smi shows one.
#
# cu128 runs on both sides -- driver 550/570 (CUDA 12.x) and 580+ (CUDA 13.x,
# backward compatible with cu12 wheels). If you are on a newer driver and want
# the newest CUDA, change the URL below to cu130 and re-run `uv lock`.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
