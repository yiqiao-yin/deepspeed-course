[project]
name = "riemann-scaling"
version = "0.1.0"
description = "Where GPU precision meets the Riemann Hypothesis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "mpmath>=1.3",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
