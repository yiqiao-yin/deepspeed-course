[project]
name = "aerial-stabilization"
version = "0.1.0"
description = "Topic 8 Lab 1 — a cold-gas car that must land on its wheels, trained by PPO."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "pillow>=10.0",
    # The rig audit solves a linear program for pure-couple authority.
    # Topic 7 published a hand-calculated authority figure that was
    # 11% wrong because it ignored the nozzle cant; an exact solver
    # costs one dependency and removes the whole class of error.
    "scipy>=1.11",
    # PPO. ~15k parameters and the bottleneck is MuJoCo on the CPU,
    # so there is nothing for ZeRO to shard -- same reasoning, and
    # the same measured outcome, as every lab in topic 7.
    # Pinned to match every other lab: a suite run against a torch
    # the learner does not have validates a world nobody is in.
    "torch==2.11.0",
]

[tool.uv]
package = false

# A custom torch index pins its companions too. With `explicit = true`
# only the packages named here come from it.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
