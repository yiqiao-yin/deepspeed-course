[project]
name = "terrain-navigation"
version = "0.1.0"
description = "A 3D arena, two kinds of obstacle, and a robot that must tell them apart"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "mujoco>=3.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.18"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
