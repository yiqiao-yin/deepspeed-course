[project]
name = "perception-pays"
version = "0.1.0"
description = "Lab 10 — how good must perception be before it pays?"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "pillow>=10.0",
    "torch==2.11.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.17"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
