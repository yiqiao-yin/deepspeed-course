[project]
name = "terrain-vlm"
version = "0.1.0"
description = "Lab 7 — can a model that SEES terrain beat one that walks into it?"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "pillow>=10.0",
    "torch==2.11.0",
    # torchvision is REQUIRED, not optional: transformers 5.x routes
    # Qwen2.5-VL's processor through Qwen2VLVideoProcessor, which hard
    # -requires it even for still images. Without it the run dies at
    # AutoProcessor.from_pretrained, before a single step.
    "torchvision",
    # Pinned to the course-wide versions. tests/test_config_kwargs.py
    # checks every lab's LOCK against one set, because a suite run
    # against a transformers no learner has validates a world nobody
    # is in -- it passes while the labs are broken.
    "transformers==5.16.1",
    "accelerate>=1.0",
    "deepspeed>=0.19",
    "peft==0.20.0",
    "qwen-vl-utils>=0.0.8",
]

[project.optional-dependencies]
tracking = ["wandb>=0.17"]

[tool.uv]
package = false

# A custom torch index pins its COMPANIONS too, or nothing works.
# torchvision carries a compiled extension linked against torch; a
# mismatched pair fails with `operator torchvision::nms does not
# exist`, which reads like a torch bug and is not one.
# tests/test_torch_index_pins.py guards this by reading the LOCK.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
